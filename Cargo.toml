# ObsidianLog Cargo workspace. Shared metadata and dependencies are centralized
# here so all members stay in lockstep on versions.

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Glory Praise Emmanuel <emmaglorypraise@gmail.com>"]
repository = "https://github.com/emmaglorypraise/ObsidianLog"
homepage = "https://github.com/emmaglorypraise/ObsidianLog"

[workspace.dependencies]
# Internal crates (path + version so they remain publishable to crates.io).
obsidianlog-core = { path = "crates/obsidianlog-core", version = "0.1.0" }
obsidianlog-store = { path = "crates/obsidianlog-store", version = "0.1.0" }
obsidianlog-ingest = { path = "crates/obsidianlog-ingest", version = "0.1.0" }

# Shared dependencies; crate-specific ones live in the member that owns them.
anyhow = "1.0.102"
thiserror = "2.0.18"
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# Timestamps in the data model (DateTime<Utc>), with serde support.
chrono = { version = "0.4.39", default-features = false, features = ["serde", "std"] }
# Async methods on the StorageBackend trait.
async-trait = "0.1.88"
# Zeroize key material on drop. Pinned to 1.8: 1.9 needs zeroize_derive 1.5,
# not yet in the index.
zeroize = { version = "=1.8.1", features = ["derive"] }

# Slimmer, faster release binaries for the cross-platform distribution targets.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
