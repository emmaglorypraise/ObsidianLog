# ObsidianLog Cargo workspace.
#
# The MVP is split into the three crates the proposal calls for:
#   - obsidianlog-store   the core storage library (compress/encrypt/chain/chunk)
#   - obsidianlog-ingest  the Vector-compatible HTTP ingest service
#   - obsidianlog         the CLI (query, verify, init) and the published binary
#
# Shared metadata and common dependencies are centralized here so every member
# stays in lockstep on versions — the maintainable default for a workspace.

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["emmaglorypraise <emmaglorypraise@gmail.com>"]
repository = "https://github.com/emmaglorypraise/ObsidianLog"
homepage = "https://github.com/emmaglorypraise/ObsidianLog"

[workspace.dependencies]
# Internal crates (path + version so they remain publishable to crates.io).
obsidianlog-core = { path = "crates/obsidianlog-core", version = "0.1.0" }
obsidianlog-store = { path = "crates/obsidianlog-store", version = "0.1.0" }
obsidianlog-ingest = { path = "crates/obsidianlog-ingest", version = "0.1.0" }

# Shared external dependencies. Crate-specific deps (zstd, aes-gcm, sha2, axum,
# tokio, keyring) live in the member that owns them.
anyhow = "1.0.102"
thiserror = "2.0.18"
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# Timestamps in the data model (DateTime<Utc>), with serde support.
chrono = { version = "0.4.39", default-features = false, features = ["serde", "std"] }
# Async methods on the StorageBackend trait (boxed, Send futures; object-safe).
async-trait = "0.1.88"
# Zeroize key material on drop so secrets don't linger in freed memory.
# Pinned to the 1.8 line: 1.9 requires zeroize_derive 1.5, not yet in the index.
zeroize = { version = "=1.8.1", features = ["derive"] }

# Slimmer, faster release binaries for the cross-platform distribution targets.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
