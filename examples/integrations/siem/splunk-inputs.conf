# Example Splunk inputs.conf stanza for monitoring ObsidianLog's archived
# logs. `obsidianlog query --format raw` emits NDJSON (one JSON object per
# line) — INDEXED_EXTRACTIONS = json tells Splunk to parse each line as a
# JSON event with no custom props/transforms needed.
#
# Usage:
#   1. Export what you want to forward:
#        obsidianlog query --format raw --from 24h > /var/log/obsidianlog/archive.ndjson
#      (run this on a schedule for ongoing export — a one-off `query` run
#      is a snapshot, not a live tail.)
#   2. Drop this stanza into $SPLUNK_HOME/etc/apps/<your_app>/local/inputs.conf
#      (adjust the path to match wherever step 1 actually wrote the file).
#   3. Restart the forwarder/instance to pick up the new input.

[monitor:///var/log/obsidianlog/archive.ndjson]
disabled = false
index = obsidianlog
sourcetype = obsidianlog:ndjson
INDEXED_EXTRACTIONS = json
KV_MODE = none
