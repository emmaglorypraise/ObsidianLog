[package]
name = "obsidianlog-cli"
description = "Long-term, tamper-evident operational log archival on Sia: client-side encrypted, zstd-compressed, hash-chained, and queryable. CLI to serve ingest, query, and verify logs, plus an interactive setup wizard. Installs the `obsidianlog` binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/obsidianlog"
readme = "README.md"
keywords = ["logging", "archival", "sia", "observability", "cli"]
categories = ["command-line-utilities"]
default-run = "obsidianlog"

[[bin]]
name = "obsidianlog"
path = "src/main.rs"

[dependencies]
obsidianlog-core.workspace = true
obsidianlog-store.workspace = true
obsidianlog-ingest.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# Config file parsing (matches obsidianlog-ingest's own config format).
toml = "1.1.2"
# OS keychain for the user-generated encryption key created by `obsidianlog init`.
keyring = "4.1.4"
# Interactive prompts for `obsidianlog init`.
dialoguer = "0.11"
# Parsing --from/--to (RFC 3339 or relative, e.g. "24h") and formatting timestamps.
chrono = { version = "0.4.39", default-features = false, features = ["serde", "std", "clock"] }
# Driving the async ArchiveEngine::query from the sync CLI (one-shot, single-threaded).
tokio = { version = "1.52.3", features = ["rt"] }

[dev-dependencies]
tempfile = "3.23.0"

[features]
# Enables the real Sia backend for serve/query/verify (off by default — see
# obsidianlog-store's `sia` feature and ADR-0006). Without it, a config that
# specifies an indexd backend fails with a clear error instead of silently
# falling back to local.
sia = ["obsidianlog-store/sia"]
