[package]
name = "obsidianlog-store"
description = "ObsidianLog core storage library: zstd compression, AES-256-GCM encryption, SHA-256 hash chaining, and append-only chunking over a pluggable Sia/indexd backend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["logging", "archival", "sia", "encryption", "compression"]
categories = ["cryptography", "filesystem"]

[dependencies]
# Shared vocabulary (Error/Result, StorageBackend trait, domain types).
obsidianlog-core.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
# Implementing the async StorageBackend trait from obsidianlog-core.
async-trait.workspace = true
# Pipeline primitives: zstd (compression), AES-256-GCM (encryption), SHA-256 (hashing).
zstd = "0.13.3"
aes-gcm = "0.11.0"
sha2 = "0.11.0"
# Zeroize-on-drop for the AES key newtype so key bytes don't linger in memory.
zeroize.workspace = true
# Time-window labels (YYYY-MM-DD-HH) for chunking.
chrono.workspace = true
# Async locks (tokio sync) for the ArchiveEngine's per-service serialization.
tokio = { version = "1.52.3", features = ["sync"] }

# Sia integration, behind the `sia` feature. Pinned exact: sia_storage is pre-1.0
# and breaks on minor bumps (see ADR-0006); it brings rustls (no native-tls).
sia_storage = { version = "=0.10.0", optional = true }

[dev-dependencies]
# Integration tests (separate crate) need the core types directly.
obsidianlog-core.workspace = true
# Driving the async StorageBackend in tests; multi-thread for the concurrency test.
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros"] }
# Throwaway directories for filesystem-backend tests.
tempfile = "3.23.0"
# Building record timestamps in the end-to-end integration tests.
chrono.workspace = true

[features]
# Default builds/tests use the in-process LocalBackend — no Sia node (ADR-0004).
default = []
# Enables the real Sia backend (pre-1.0 sia_storage SDK), off by default. Also
# turns on tokio's io-util for the SDK's async upload/download.
sia = ["dep:sia_storage", "tokio/io-util"]
